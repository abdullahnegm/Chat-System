name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # <-- needs write to comment on PRs
      issues: read
      id-token: write

    steps:
      - name: Load review prompt
        id: load_prompt
        run: |
          echo "PROMPT<<EOF" >> "$GITHUB_OUTPUT"
          cat .claude/commands/review-pr.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Load system instructions
        id: load_sys
        run: |
          echo "SYS<<EOF" >> "$GITHUB_OUTPUT"
          cat CLAUDE.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Either pick "model" or "anthropic_model" depending on the action docs
          # model: claude-3-5-sonnet-20241022
          anthropic_model: claude-3-5-sonnet-20241022

          direct_prompt: ${{ steps.load_prompt.outputs.PROMPT }}
          custom_instructions: ${{ steps.load_sys.outputs.SYS }}

          # Whitelist tools directly here (no --allowed_tools flags)
          allowed_tools: |
            mcp__github_inline_comment__create_inline_comment

          use_sticky_comment: true

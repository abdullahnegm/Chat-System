name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load review prompt
        id: load_prompt
        shell: bash
        run: |
          delimiter="$(openssl rand -hex 16)"
          echo "PROMPT<<$delimiter" >> "$GITHUB_OUTPUT"
          cat .claude/commands/review-pr.md >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Load system instructions
        id: load_sys
        shell: bash
        run: |
          delimiter="$(openssl rand -hex 16)"
          echo "SYS<<$delimiter" >> "$GITHUB_OUTPUT"
          cat CLAUDE.md >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic_model: claude-3-5-sonnet-20241022

          direct_prompt: ${{ steps.load_prompt.outputs.PROMPT }}
          custom_instructions: ${{ steps.load_sys.outputs.SYS }}

          allowed_tools: |
            mcp__github_inline_comment__create_inline_comment

          use_sticky_comment: true

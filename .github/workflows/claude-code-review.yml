name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load review prompt and system instructions
        id: load_content
        shell: bash
        run: |
          # Load prompt
          echo "PROMPT<<PROMPT_EOF" >> "$GITHUB_OUTPUT"
          cat .claude/commands/review-pr.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"  # Ensure newline before delimiter
          echo "PROMPT_EOF" >> "$GITHUB_OUTPUT"

          # Load system instructions
          echo "SYS<<SYS_EOF" >> "$GITHUB_OUTPUT"
          cat CLAUDE.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"  # Ensure newline before delimiter
          echo "SYS_EOF" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic_model: claude-3-5-sonnet-latest

          direct_prompt: ${{ steps.load_content.outputs.PROMPT }}
          custom_instructions: ${{ steps.load_content.outputs.SYS }}

          allowed_tools: |
            mcp__github_inline_comment__create_inline_comment

          use_sticky_comment: true
